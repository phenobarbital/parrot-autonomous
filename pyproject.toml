[project]
name = "navigator-agent-servers"
version = "0.0.1"
description = "Navigator Agent server"
authors = [
    {name = "Jesus Lara", email = "jlara@trocglobal.com"}
]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # parrot basic
    "navigator-api>=0.0.1",
    "navigator-auth>=0.0.1",
    "async-notify[telegram]>=0.0.1",
    "opencv-python==4.10.0.84",
    "tiktoken==0.9.0",
    "mammoth==1.8.0",
    "yt-dlp==2025.8.22",
    "ai-parrot[agents,integrations,llms]>=0.23.0",
]

production = [
    "gunicorn",
    "uvicorn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# uv-specific configuration
[tool.uv]
package = false
override-dependencies = [
    "emoji==1.7.0",
    "msal==1.32.0",
    "jsonpickle==3.0.2",
    "watchdog>=6.0.0",
    "folium==0.20.0",
    "webdriver-manager==4.0.2",
    "pyjwt==2.10.1",
    "networkx==3.5",
    "pandas-gbq==0.29.0"
]

[tool.uv.sources]
ai-parrot = { path = "../../navigator/ai-parrot", editable = true }